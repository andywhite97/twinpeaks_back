{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Preview — {{ post.title }}</title><link rel="stylesheet" href="{% static 'blog/editor.css' %}"></head><body class="blog-preview"><main><p>STAFF PREVIEW · Saved version · {{ post.get_status_display }}</p><h1>{{ post.title }}</h1><p>{{ post.author_name }} · {{ post.reading_minutes }} min read</p><p>{{ post.excerpt }}</p>{% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="{{ post.cover_alt }}">{% endif %}<article>{{ post.body|safe }}</article></main></body></html>

services:
  - type: web
    name: twinpeaks-back
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn twinpeaks.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: twinpeaks-back.onrender.com,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: twinpeaks-sql
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://twinpeaksinvestment.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BIRD_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
